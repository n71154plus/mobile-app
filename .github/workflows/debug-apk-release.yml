name: Debug APK Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # JDK 17 是 Android Gradle Plugin 官方建議
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Android SDK cache（非常重要）
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 強制清掉壞掉的 debug keystore
      - name: Reset debug keystore
        run: rm -f ~/.android/debug.keystore

      # Restore release keystore（只給 release 用）
      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > androidApp/upload-keystore.jks
          cat > androidApp/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Clean project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      # 取得 timestamp version
      - name: Get build info
        id: vars
        run: |
          echo "timestamp=$(date -u +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      # 建立 tag
      - name: Create Git tag
        id: tag
        run: |
          TAG=debug-${{ steps.vars.outputs.timestamp }}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag "$TAG"
          git push origin "$TAG"

      # 發佈 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "🚀 Debug Build ${{ steps.vars.outputs.timestamp }}"
          body: |
            ## Debug APK Release

            ### Commit
            ${{ github.event.head_commit.message }}

            ⚠️ Debug build only  
            - logging enabled
            - not optimized
          files: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
